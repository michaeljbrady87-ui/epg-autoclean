name: Auto-Clean EPG

on:
  schedule:
    - cron: '0 3 * * *'   # Daily at 3:00 AM UTC
  workflow_dispatch:

jobs:
  clean-epg:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: pip install requests

    - name: Download, clean, and gzip EPG
      env:
        USERNAME: 4xB5pzRkVH
        PASSWORD: XMVEydMqNj
      run: |
        python << 'EOF'
        import requests
        import xml.etree.ElementTree as ET
        import io
        import gzip
        import os
        import time

        url = (
            "http://link4tv.me:80/xmltv.php"
            f"?username={os.environ['USERNAME']}"
            f"&password={os.environ['PASSWORD']}"
        )

        headers = {
            "User-Agent": "Mozilla/5.0 (Android TV; Linux; Shield) OTT-Navigator"
        }

        os.makedirs("epg", exist_ok=True)
        output_path = "epg/epg.xml.gz"

        last_exception = None

        for attempt in range(1, 6):
            try:
                print(f"Attempt {attempt}: downloading EPG...")
                r = requests.get(
                    url,
                    headers=headers,
                    timeout=90,
                    stream=True
                )
                r.raise_for_status()

                xml_text = r.text

                tree = ET.parse(io.StringIO(xml_text))
                root = tree.getroot()

                removed = 0
                for parent in root.iter():
                    for child in list(parent):
                        if child.tag == "icon":
                            parent.remove(child)
                            removed += 1

                print(f"Removed {removed} <icon> tags")

                xml_bytes = ET.tostring(
                    root,
                    encoding="utf-8",
                    xml_declaration=True
                )

                with gzip.open(output_path, "wb") as f:
                    f.write(xml_bytes)

                print("EPG cleaned and gzipped successfully")
                break

            except Exception as e:
                last_exception = e
                print(f"Attempt {attempt} failed: {e}")
                time.sleep(15 * attempt)

        else:
            if os.path.exists(output_path):
                print("Download failed — reusing last known good EPG")
            else:
                raise last_exception
        EOF

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: epg
